name: ferxarp
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ferxarp
      POSTGRES_USER: ferxarp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required private environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ferxarp -d ferxarp']
      interval: 5s
      timeout: 3s
      retries: 20
  chroma:
    image: chromadb/chroma:1.5.0
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    networks: [data]
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000;
          printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r line <&3;
          [[ "$$line" == *" 200 "* ]]
      interval: 10s
      timeout: 3s
      retries: 20
  backend:
    image: ferxarp/backend:${FERXARP_SOURCE_SHA:?Required source SHA}
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ferxarp:${POSTGRES_PASSWORD}@postgres:5432/ferxarp
      JWT_SECRET: ${JWT_SECRET:?Required private environment}
      FERXARP_SEED_PASSWORD: ${FERXARP_SEED_PASSWORD:?Required private environment}
      CHROMA_URL: http://chroma:8000
      FRONTEND_ORIGIN: ${FERXARP_PUBLIC_URL:-http://127.0.0.1:18080}
      RUST_LOG: info
    networks: [data, web]
    depends_on:
      postgres: {condition: service_healthy}
      chroma: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, 'http://127.0.0.1:8000/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  frontend:
    image: ferxarp/frontend:${FERXARP_SOURCE_SHA}
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FERXARP_HTTP_PORT:-18080}:3000"
    networks: [web]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  presentation:
    image: ferxarp/presentation:${PRESENTATION_SOURCE_SHA:?Required presentation SHA}
    build:
      context: ../../../presentation
      dockerfile: /srv/ferxarp/repo/deploy/eisenherz/Presentation.Dockerfile
      args:
        NEXT_PUBLIC_FERXARP_DEMO_URL: ${FERXARP_PUBLIC_URL:-http://127.0.0.1:18080}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRESENTATION_HTTP_PORT:-18081}:3000"
    networks: [web]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  postgres_data:
    name: ferxarp_postgres_data
  chroma_data:
    name: ferxarp_chroma_data
networks:
  data:
    internal: true
  web:
